name: Validate data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Run offline validators
        run: npm run validate

  online:
    # Baixa arquivos fixados da CDN (three, world-atlas). Falhas de rede não
    # bloqueiam o PR, mas aparecem como aviso no resumo da execução.
    name: Online audits (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Run online validators
        run: npm run validate:online

  browser:
    # Abre o site num Chrome sem janela: globo carrega, link #/BR, área
    # clicável das cidades no Brasil e página de país. Usa a CDN do three.js.
    name: Browser smoke test (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Run browser smoke test
        run: npm run test:browser

  react:
    # A interface compilada (app/) é exatamente o que src/ gera, e o teste de
    # teclado e leitor de tela (axe) passa num Chrome sem janela.
    name: React build and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Build matches the committed app/
        run: npm run build && git diff --exit-code --text -- app
      - name: Keyboard and screen reader tests
        run: npm run test:a11y
