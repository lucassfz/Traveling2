  <script>
    // Aplica o tema salvo antes da primeira pintura, para a abertura e a
    // página não piscarem no tema errado. app.js continua dono da lógica.
    try {
      var savedTheme = localStorage.getItem('traveling.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
        if (savedTheme === 'light') document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#eef1f3');
      }
    } catch (error) { /* armazenamento bloqueado: segue o padrão escuro */ }
    // Ajustes de acessibilidade (texto, contraste, animações) antes da primeira pintura.
    try {
      var a11y = JSON.parse(localStorage.getItem('traveling.a11y') || 'null');
      if (a11y && (a11y.text === 'large' || a11y.text === 'xlarge')) document.documentElement.dataset.text = a11y.text;
      if (a11y && a11y.contrast === true) document.documentElement.dataset.contrast = 'high';
      if (a11y && a11y.motion === true) document.documentElement.dataset.motion = 'reduce';
    } catch (error) { /* sem ajustes salvos */ }
  </script>

  <script>
  window.__travelingBoot = { interactive: false };
  window.setTimeout(function () {
    if (window.__travelingBoot && window.__travelingBoot.interactive) return;
    var splash = document.getElementById('splash-screen');
    var error = document.getElementById('boot-error');
    if (error) error.hidden = false;
    if (splash) splash.classList.add('splash-screen--exit');
  }, 8000);
  </script>
